let ac=null, musicNodes=null;
function actx(){ ac = ac || new (window.AudioContext||window.webkitAudioContext)(); return ac; }
function click(freq){
  if(!state.sound) return;
  try{
    const c=actx(), o=c.createOscillator(), g=c.createGain();
    o.type="sine"; o.frequency.value=freq||660;
    g.gain.setValueAtTime(0.0001,c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.09,c.currentTime+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+0.16);
    o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime+0.18);
  }catch(e){}
}
function toggleMusic(on){
  state.music=on; save();
  document.getElementById("btnMusic").setAttribute("aria-pressed", on?"true":"false");
  if(!on){ if(musicNodes){ musicNodes.g.gain.linearRampToValueAtTime(0.0001, actx().currentTime+.5); musicNodes.stop(); musicNodes=null; } return; }
  try{
    const c=actx(), g=c.createGain(); g.gain.value=0.0001; g.connect(c.destination);
    g.gain.linearRampToValueAtTime(0.035, c.currentTime+1);
    const notes=[392,440,523.25,587.33,659.25];
    let i=0, timer=setInterval(()=>{
      const o=c.createOscillator(), gg=c.createGain(); o.type="triangle";
      o.frequency.value=notes[i++%notes.length];
      gg.gain.setValueAtTime(0.0001,c.currentTime);
      gg.gain.exponentialRampToValueAtTime(0.5,c.currentTime+.2);
      gg.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+1.6);
      o.connect(gg).connect(g); o.start(); o.stop(c.currentTime+1.7);
    },1300);
    musicNodes={g,stop:()=>clearInterval(timer)};
  }catch(e){}
}
function speak(text){
  if(!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang="pt-BR"; u.rate=state.rate; u.pitch=state.pitch;
  speechSynthesis.speak(u);
}

function tile(t,e,say){
  const isFav = state.favItems && state.favItems.some(f=>f.t===t);
  return `<button class="tile" data-word="${esc(t)}" data-emo="${e}" data-say="${esc(say||t)}">
    <div class="fav-star ${isFav?'is-fav':''}" data-favitem="${esc(t)}" data-favitem-emo="${e}" data-favitem-say="${esc(say||t)}" aria-label="Favoritar">${isFav?'⭐':'☆'}</div>
    ${emoEsc(e)}<span>${esc(t)}</span></button>`;
}

function renderPhrase(){
  const box=document.getElementById("phraseBox");
  document.getElementById("phraseCount").textContent = state.phrase.length+(state.phrase.length===1?" palavra":" palavras");
  box.innerHTML = state.phrase.length
    ? state.phrase.map((w,i)=>`<span class="chip" data-rm="${i}">${w.e} ${esc(w.t)}</span>`).join("")
    : `<span class="empty">Escolha os botões acima para montar sua frase.</span>`;
  const st=document.getElementById("btnFavPhrase");
  if(st) st.setAttribute("aria-pressed", isFavPhrase(phraseText())?"true":"false");
  renderRecentHome();
}
/* ============ eventos ============ */
let holdTimer=null;
document.addEventListener("click",e=>{
  const btnSair = e.target.closest("#btnSair");
  if (btnSair) {
    click();
    state.registered = false;
    save();
    
    let ob = document.getElementById("onboarding");
    if (!ob) {
      ob = document.createElement("div");
      ob.id = "onboarding";
      document.body.prepend(ob);
    }
    
    renderOnboarding();
    return;
  }
  const nav=e.target.closest(".nav-btn");

  if(nav){ click(700); state.view=nav.dataset.nav==="home"?"home":nav.dataset.nav; save(); render(); window.scrollTo({top:0}); return; }
  const btnFavs=e.target.closest("#btnFavs");
  if(btnFavs){ click(700); state.view="favs"; save(); render(); window.scrollTo({top:0}); return; }
  const qs=e.target.closest(".pill[data-say]");
  if(qs){ click(880); qs.classList.add("press"); setTimeout(()=>qs.classList.remove("press"),160); speak(qs.dataset.say); return; }
  const p=e.target.closest(".pill[data-cat]");
  if(p){ click(620); state.cat=p.dataset.cat; state.view="cat"; save(); render(); window.scrollTo({top:0}); return; }
  if(e.target.closest("#back")){ click(520); state.view="comunicar"; save(); render(); return; }

  const t=e.target.closest(".tile");
  const favStar=e.target.closest(".fav-star");
  if(favStar){
    e.stopPropagation();
    click(900);
    toggleFavItem(favStar.dataset.favitem, favStar.dataset.favitemEmo, favStar.dataset.favitemSay);
    return;
  }
  if(t){ click(760); state.phrase.push({t:t.dataset.word,e:t.dataset.emo}); save(); renderPhrase(); speak(t.dataset.say||t.dataset.word); return; }
  const chip=e.target.closest(".chip[data-rm]");
  const frr=e.target.closest("[data-usephrase-recent]");
  if(frr){ click(760); const f=state.favPhrases[+frr.dataset.usephraseRecent];
    state.phrase = (f.w&&f.w.length? f.w.map(w=>({t:w.t,e:w.e})) : f.t.split(" ").map(x=>({t:x,e:"💬"})));
    save(); renderPhrase(); speak(f.t); return; }
  const srr=e.target.closest("[data-sayphrase-recent]");
  if(srr){ click(700); speak(state.favPhrases[+srr.dataset.sayphraseRecent].t); return; }
  if(chip){ click(480); state.phrase.splice(+chip.dataset.rm,1); save(); renderPhrase(); return; }
  const fp=e.target.closest("[data-usephrase]");
  if(fp){ click(760); const f=state.favPhrases[+fp.dataset.usephrase];
    state.phrase = (f.w&&f.w.length? f.w.map(w=>({t:w.t,e:w.e})) : f.t.split(" ").map(x=>({t:x,e:"💬"})));
    save(); renderPhrase(); toast("Frase pronta em Minha Frase 💬"); return; }
  const sp=e.target.closest("[data-sayphrase]");
  if(sp){ click(700); speak(state.favPhrases[+sp.dataset.sayphrase].t); return; }
  const dp=e.target.closest("[data-delphrase]");
  if(dp){ click(420); state.favPhrases.splice(+dp.dataset.delphrase,1); save(); render(); renderPhrase(); toast("Frase removida dos favoritos"); return; }
  if(e.target.closest("#btnFavPhrase")){ click(900); toggleFavPhrase(); return; }
  const sr=e.target.closest("[data-sayrout]");
  if(sr){ click(700); const r=state.routine[+sr.dataset.sayrout]; if(r) speak(r.s||r.t); return; }
  const btnDone = e.target.closest(".btn-terminei");

  if(btnDone){
    click(880);
    const idx = +btnDone.dataset.done;
    if(idx >= 0){
      state.done[idx] = true;
      save();
      
      const nextTask = state.routine[idx+1];
      let msg = "Tarefa concluída.";
      if(nextTask) msg += " Agora é hora de " + (nextTask.t.toLowerCase()) + ".";
      speak(msg);
      
      render();
    }
    return;
  }
  if(e.target.closest("#resetRoutine")){ click(560); state.done={}; save(); render(); return; }

  if(e.target.closest("#btnSpeak")){ click(700); if(state.phrase.length) speak(state.phrase.map(w=>w.t).join(" ")); return; }
  if(e.target.closest("#btnClear")){ click(400); state.phrase=[]; save(); renderPhrase(); return; }
  if(e.target.closest("#btnFav")){ click(720); state.view="favs"; save(); render(); return; }
  if(e.target.closest("#btnSet")){ click(720); state.view="config"; save(); render(); return; }
  if(e.target.closest("#btnMusic")){ click(720); toggleMusic(!state.music); return; }
  if(e.target.closest("#btnGoToComm")){ click(700); state.view="comunicar"; save(); render(); return; }
  if(e.target.closest("#btnExport")){ exportHTML(); return; }
  
  const btnAddPhoto = e.target.closest("#btnAddPhoto");
  if (btnAddPhoto) {
    document.getElementById("photoInput").click();
    return;
  }


  
  const genderOpt = e.target.closest(".gender-opt");
  if (genderOpt) {
    click(600);
    state.childGender = genderOpt.dataset.gender;
    document.querySelectorAll(".gender-opt").forEach(b => b.classList.remove("active"));
    genderOpt.classList.add("active");
    return;
  }
  
  const btnSave = e.target.closest("#btnSaveProfile");
  if (btnSave) {
    click(900);
    const newName = document.getElementById("profileName").value.trim();
    const newAge = document.getElementById("profileAge").value;
    
    if (!newName) {
      toast("Por favor, digite o nome.");
      return;
    }
    
    state.childName = newName;
    state.childAge = newAge;
    save();
    toast("Alterações salvas! ⭐");
    render();
    return;
  }

});

document.addEventListener("change",e=>{
  if(e.target.id==="cSound"){ state.sound=e.target.checked; save(); }
  if(e.target.id==="cMusic"){ toggleMusic(e.target.checked); }
  if(e.target.id==="cRate"){ state.rate=+e.target.value; save(); }
  if(e.target.id==="cPitch"){ state.pitch=+e.target.value; save(); }
  if(e.target.id==="photoInput"){
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (re) => {
      state.childPhoto = re.target.result;
      save();
      render();
    };
    reader.readAsDataURL(file);
  }

});

["pointerdown"].forEach(ev=>document.addEventListener(ev,e=>{
  const t=e.target.closest(".tile"); if(!t) return;
  holdTimer=setTimeout(()=>{
    const w={t:t.dataset.word,e:t.dataset.emo};
    const i=state.favs.findIndex(f=>f.t===w.t);
    if(i>=0) state.favs.splice(i,1); else state.favs.push(w);
    save(); click(900); render();
    holdTimer=null;
  },650);
}));
["pointerup","pointerleave","pointercancel"].forEach(ev=>document.addEventListener(ev,()=>{ if(holdTimer){clearTimeout(holdTimer);holdTimer=null;} }));

async function exportHTML(){
  // Before cloning, ensure we don't export the PWA popup
  const pwaContainer = document.getElementById("pwa-container");
  let pwaBackup = null;
  if (pwaContainer) {
    pwaBackup = pwaContainer.innerHTML;
    pwaContainer.innerHTML = "";
  }

  const toastEl = document.getElementById("toast");

  if (toastEl) {
    toastEl.textContent = "Preparando exportação...";
    toastEl.classList.add("show");
  }
  
  // Create a clean clone for export
  const docClone = document.documentElement.cloneNode(true);

  // Update state in clone: instalação NOVA, sem nenhum dado pessoal
  const cloneScripts = docClone.querySelectorAll('script');
  let scriptFound = false;
  cloneScripts.forEach(s => {
    if (s.textContent.includes('const state = Object.assign')) {
      s.textContent = s.textContent.replace(/const state = Object\.assign\(\{.*?\}\s*,\s*JSON\.parse\(localStorage\.getItem\(KEY\)\|\|"\{\}"\)\);/s, 
        `const state = Object.assign(${JSON.stringify({
          phrase:[], favs:[], favPhrases:[], music:false, sound:true, rate:state.rate, pitch:state.pitch, done:{}, routine:ROUTINE_DEFAULT, view:"home", cat:null, rateV:state.rateV, childName: "", favItems:[], registered: false, childGender: "", childAge: null, childPhoto: ""
        })}, JSON.parse(localStorage.getItem(KEY)||"{}"));`);
      scriptFound = true;
    }
  });

  // Neutraliza o DOM exportado: nada de Home/nome renderizados estaticamente
  const appClone = docClone.querySelector('.app');
  if (appClone) appClone.classList.add('hidden');
  const mainClone = docClone.querySelector('#main');
  if (mainClone) mainClone.innerHTML = '';
  const phraseBoxClone = docClone.querySelector('#phraseBox');
  if (phraseBoxClone) phraseBoxClone.innerHTML = '';
  const phraseBarClone = docClone.querySelector('#phraseBar');
  if (phraseBarClone) phraseBarClone.classList.add('hidden');
  let onbClone = docClone.querySelector('#onboarding');
  if (!onbClone) {
    onbClone = docClone.ownerDocument
      ? docClone.ownerDocument.createElement('div')
      : document.createElement('div');
    onbClone.id = 'onboarding';
    const bodyClone = docClone.querySelector('body');
    if (bodyClone) bodyClone.prepend(onbClone);
  }
  onbClone.innerHTML = '';
  
  // Ensure the Sair button in the export uses the same reliable logic
  // 1. REMOVE TEMPORARY ELEMENTS FROM CLONE

  const elementsToRemove = [
    '#toast',
    '.export-toast',
    '.loading',
    '.loader',
    '.exporting',
    '.notification',
    '.overlay'
  ];
  elementsToRemove.forEach(selector => {
    const el = docClone.querySelector(selector);
    if (el) el.remove();
  });
  
  // Also ensure the toast class is removed if the element itself wasn't removed
  const toastClone = docClone.querySelector('#toast');
  if (toastClone) toastClone.classList.remove('show');

  const head = docClone.querySelector('head');
  
  // 2. INCORPORATE BANNER (data:image/...)
  let bannerBase64 = null;
  // 2. INCORPORATE BANNER & LOGO (data:image/...)
  const fetchAsBase64 = async (url, maxW, type, quality) => {
    try {
      const resp = await fetch(url);
      const blob = await resp.blob();
      const raw = await new Promise((resolve) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result);
        reader.readAsDataURL(blob);
      });
      if (!maxW) return raw;
      // Reduz o peso da imagem para manter o HTML exportado leve e válido
      return await new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          try {
            const scale = Math.min(1, maxW / img.naturalWidth);
            const cv = document.createElement("canvas");
            cv.width = Math.round(img.naturalWidth * scale);
            cv.height = Math.round(img.naturalHeight * scale);
            cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
            resolve(cv.toDataURL(type || "image/jpeg", quality || 0.82));
          } catch (e) { resolve(raw); }
        };
        img.onerror = () => resolve(raw);
        img.src = raw;
      });
    } catch (e) {
      console.error("Export: fetch error for " + url, e);
      return null;
    }
  };

  const bannerB64 = await fetchAsBase64(window.BANNER_BG_URL || 'https://i.imgur.com/3f4oVjB.png', 1000, 'image/jpeg', 0.82);
  const logoB64 = await fetchAsBase64(window.LOGO_URL || '/logo.png', 256, 'image/png');

  if (bannerB64) {
    const styleTags = docClone.querySelectorAll('style');
    styleTags.forEach(styleTag => {
      styleTag.innerHTML = styleTag.innerHTML.replace(/--banner-bg:\s*url\([^)]+\)/g, `--banner-bg: url("${bannerB64}")`);
    });
  }

  // Injeta as imagens como Data URI (offline) antes de qualquer script do app
  if (bannerB64 || logoB64) {
    const imgScript = document.createElement('script');
    imgScript.textContent =
      (bannerB64 ? `window.BANNER_BG_URL = ${JSON.stringify(bannerB64)};` : '') +
      (logoB64 ? `window.LOGO_URL = ${JSON.stringify(logoB64)};` : '');
    if (head) head.prepend(imgScript);
  }



  if (logoB64) {
    // Apply to all logo images in the clone
    const logos = docClone.querySelectorAll('.tea-logo, .logo img, .nav-logo-circle img');
    logos.forEach(img => {
      img.src = logoB64;
    });

    // Set favicon in head
    let link = docClone.querySelector("link[rel~='icon']");
    if (!link) {
      link = document.createElement('link');
      link.rel = 'icon';
      head.appendChild(link);
    }
    link.href = logoB64;
  }

  // 4. CLEAN SCRIPTS
  const scripts = docClone.querySelectorAll('script');
  scripts.forEach(s => {
    if (s.src && (s.src.includes('vite') || s.src.includes('node_modules') || s.src.includes('.tsx') || s.src.includes('.ts'))) {
      s.remove();
    }
  });

  // 5. SERIALIZE AND DOWNLOAD
  const html="<!doctype html>\n" + docClone.outerHTML;
  const blob=new Blob([html],{type:"text/html;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download="tea-kids.html";
  document.body.appendChild(a); a.click(); a.remove();
  
  if (toastEl) {
    setTimeout(() => toastEl.classList.remove("show"), 500);
  }
  
  if (pwaContainer && pwaBackup) {
    pwaContainer.innerHTML = pwaBackup;
    // Re-bind close button if it was visible
    const btnPwaOk = document.getElementById("btnPwaOk");
    if (btnPwaOk) {
      btnPwaOk.onclick = () => {
        click(880);
        const overlay = document.getElementById("pwaOverlay");
        if (overlay) overlay.classList.remove("show");
        localStorage.setItem(KEY + ".pwa_shown", "true");
        setTimeout(() => { pwaContainer.innerHTML = ""; }, 400);
      };
    }
  }

  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}



/* ============ céu com brilhos ============ */
(function(){
  const cv=document.getElementById("stars"), ctx=cv.getContext("2d");
  let w,h,dots=[];
  function init(){
    w=cv.width=innerWidth; h=cv.height=innerHeight;
    dots=Array.from({length:Math.min(90,Math.round(w*h/16000))},()=>({
      x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.6+.4,a:Math.random(),s:Math.random()*.012+.003
    }));
  }
  function loop(){
    ctx.clearRect(0,0,w,h);
    dots.forEach(d=>{ d.a+=d.s; const o=(Math.sin(d.a)+1)/2*.8+.1;
      ctx.beginPath(); ctx.fillStyle="rgba(255,255,255,"+o.toFixed(2)+")";
      ctx.arc(d.x,d.y,d.r,0,7); ctx.fill(); });
    requestAnimationFrame(loop);
  }
  addEventListener("resize",init); init(); loop();
})();

  if (isPWA || wasShown) return;

  const container = document.getElementById("pwa-container");
  if (!container) return;

  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
  const logoUrl = window.LOGO_URL || '/logo.png';

  let stepsHtml = "";
  if (isIOS || isSafari) {
    stepsHtml = `
      <div class="pwa-step">
        <div class="pwa-step-num">1</div>
        <div class="pwa-step-txt">Toque no botão <b>“Compartilhar”</b> no Safari.</div>

        <div class="pwa-step-num">3</div>
        <div class="pwa-step-txt">Toque em <b>“Adicionar”</b>.</div>
      </div>
    `;
  } else {
    stepsHtml = `
      <div class="pwa-step">
        <div class="pwa-step-num">1</div>
        <div class="pwa-step-txt">Abra o menu do navegador (três pontinhos).</div>
      </div>
      <div class="pwa-step">
        <div class="pwa-step-num">2</div>
        <div class="pwa-step-txt">Escolha <b>“Instalar aplicativo”</b> ou “Adicionar à tela inicial”.</div>
      </div>
      <div class="pwa-step">
        <div class="pwa-step-num">3</div>
        <div class="pwa-step-txt">Confirme em <b>“Instalar”</b>.</div>
      </div>
    `;
  }

  container.innerHTML = `
    <div class="pwa-overlay" id="pwaOverlay">
      <div class="pwa-card">
        <img src="${logoUrl}" class="pwa-logo" alt="COMUNICA NINHO">
        <h2 class="pwa-title">Instale o COMUNICA NINHO 💙</h2>
        <p class="pwa-subtitle">É rapidinho!</p>
        
        <div class="pwa-steps">
          ${stepsHtml}

        <button class="btn-pwa-ok" id="btnPwaOk">Entendi</button>
      </div>
    </div>
  `;

  const overlay = document.getElementById("pwaOverlay");
  setTimeout(() => overlay.classList.add("show"), 100);

  document.getElementById("btnPwaOk").onclick = () => {
    click(880);
    overlay.classList.remove("show");
    localStorage.setItem(KEY + ".pwa_shown", "true");
    setTimeout(() => {
      container.innerHTML = "";
    }, 400);
  };
}

/* ============ init ============ */
function initApp() {
  const container = document.getElementById("onboarding");
  const appEl = document.querySelector(".app");
  if (!container || !appEl) {
    console.log("COMUNICA NINHO: Root elements missing, retrying...");
    setTimeout(initApp, 100);
    return;
  }
  
  if (!state.registered) {
    renderOnboarding();
  } else {
    const container = document.getElementById("onboarding");
    if (container) container.remove();
    appEl.classList.remove("hidden");
    render();
    // Show PWA popup only after successful login/onboarding check
    showPwaPopup();
  }
  
  if(state.music) {
    const btnMusic = document.getElementById("btnMusic");
    if (btnMusic) btnMusic.setAttribute("aria-pressed","true");
    addEventListener("pointerdown",function once(){ toggleMusic(true); removeEventListener("pointerdown",once); },{once:true});
  }
  
  let logoHits=0, logoTimer=null;
  const logoBtn = document.getElementById("logo");
  if (logoBtn) {
    logoBtn.addEventListener("click",()=>{
      click(880); logoHits++;
      clearTimeout(logoTimer); logoTimer=setTimeout(()=>logoHits=0,1600);
      if(logoHits>=5){ logoHits=0; exportHTML(); }
    });
  }
}
initApp();
